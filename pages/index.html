<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名古屋ホテル Deal Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>名古屋ホテル Deal Tracker</h1>
    <p id="updated-at">最終更新: 読み込み中...</p>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="テーマ切替">🌙</button>
  </header>

  <!-- ダッシュボード要約バナー（土曜基準） -->
  <div id="summary-banner" class="summary-banner">
    <div class="summary-card">
      <div class="summary-label">追跡中</div>
      <div class="summary-value" id="summary-hotel-count">--</div>
      <div class="summary-unit">ホテル</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">土曜最安</div>
      <div class="summary-value" id="summary-cheapest-price">--</div>
      <div class="summary-unit" id="summary-cheapest-name">取得中...</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">次の土曜</div>
      <div class="summary-value" id="summary-sat-price">--</div>
      <div class="summary-unit" id="summary-sat-detail">取得中...</div>
    </div>
  </div>

  <!-- スティッキーナビゲーション -->
  <nav class="sticky-nav" aria-label="セクションナビゲーション">
    <ul class="sticky-nav-list">
      <li><a href="#sat-best-section">土曜ベスト</a></li>
      <li><a href="#chart-section">価格推移チャート</a></li>
      <li><a href="#heatmap-section">ヒートマップ</a></li>
      <li><a href="#hotels-section">ホテル一覧</a></li>
    </ul>
  </nav>

  <main>
    <!-- 1. 土曜ベスト早見表 -->
    <section id="sat-best-section">
      <h2>土曜ベスト早見表</h2>
      <p class="section-note">直近〜4週先の各土曜で最も安いホテルと価格（安い土曜順）</p>
      <div id="sat-best-container"></div>
    </section>

    <!-- 2. 価格推移チャート -->
    <section id="chart-section">
      <h2>価格推移（直近取得分・土曜のみ）</h2>
      <div class="chart-controls">
        <label for="chart-hotel-select">ホテル選択:</label>
        <select id="chart-hotel-select">
          <option value="all">全ホテル（中央値）</option>
        </select>
        <button id="compare-toggle" class="compare-btn" type="button">比較モード</button>
      </div>
      <div id="compare-panel" class="compare-panel" style="display:none;">
        <div class="compare-panel-header">
          <span>比較するホテルを選択（最大5件）:</span>
          <button id="compare-clear" class="compare-clear-btn" type="button">クリア</button>
        </div>
        <div id="compare-checkboxes" class="compare-checkboxes"></div>
      </div>
      <canvas id="price-chart"></canvas>
    </section>

    <!-- 3. 土曜×ホテル価格ヒートマップ（折りたたみ） -->
    <section id="heatmap-section">
      <details id="heatmap-details">
        <summary>土曜 × ホテル 価格ヒートマップを表示</summary>
        <div id="heatmap-container"></div>
      </details>
    </section>

    <!-- 4. ホテル一覧 -->
    <section id="hotels-section">
      <h2>ホテル一覧</h2>
      <div id="hotel-cards" class="card-grid"></div>
    </section>
  </main>

  <footer>
    <p>※ 楽天トラベル掲載価格（税込・1室2名利用時）・土曜泊のみ追跡</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
